<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Викторины- проверьте свои знания в полете">
    <meta name="theme-color" content="#1a2539">
    <title>Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style_light.css">
</head>
<body>
    <!-- Бургер-кнопка: открывает меню выбора темы -->
    <button class="burger-btn" id="burger-btn" data-label="openThemeMenu" aria-haspopup="dialog" aria-expanded="false">
        <span class="burger-btn__line"></span>
        <span class="burger-btn__line"></span>
        <span class="burger-btn__line"></span>
    </button>

    <!-- Кнопка выхода/возврата на портал -->
    <button class="exit-btn" id="exit-btn" data-label="exitQuizAriaLabel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>

    <!-- Селектор языка интерфейса -->
    <div class="language-selector" id="language-selector">
        <button
            type="button"
            class="language-selector__toggle"
            id="language-selector-toggle"
            aria-haspopup="listbox"
            aria-expanded="false"
            data-label="chooseInterfaceLanguage"
        ></button>
        <div class="language-selector__dropdown" id="language-selector-dropdown" role="listbox" data-label="availableLanguages"></div>
    </div>

    <!-- Выдвижное меню выбора темы -->
    <div class="theme-drawer-overlay" id="theme-drawer-overlay"></div>
    <div class="theme-drawer" id="theme-drawer" role="dialog" aria-modal="true" aria-labelledby="theme-drawer-title">
        <button class="theme-drawer__close" id="theme-drawer-close" data-label="closeMenu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <h2 class="theme-drawer__title" id="theme-drawer-title" data-text="chooseCategory"></h2>
        <div class="theme-drawer__list" id="theme-drawer-list" role="listbox" data-label="themesList">
            <!-- Пункты меню генерируются из js/categories.js -->
        </div>
    </div>

    <div class="container">
        <!-- Главный экран -->
        <div id="welcome-screen" class="screen active">

            <div class="logo">
                <h1 class="main-title" data-text="mainTitle"></h1>
                <p class="subtitle" data-text="subtitle"></p>
            </div>

            <div class="category-selection">
                <div class="categories" id="categories-container">
                    <!-- Кнопки категорий генерируются автоматически из js/categories.js -->
                </div>
            </div>
        </div>

        <!-- Экран информации о категории -->
        <div id="category-info-screen" class="screen">
            <div class="category-info-content">
                <div class="category-info-icon" id="category-info-icon" aria-hidden="true">🎬</div>
                <h2 class="category-info-title" id="category-info-title">Кино на борту</h2>
                <p class="category-info-description" id="category-info-description">Проверьте свои знания о фильмах и кинематографе.</p>

                <div class="category-info-divider" aria-hidden="true"></div>

                <div class="category-info-stats">
                    <div class="info-stat-item">
                        <span class="info-stat-label" data-text="questionsLabel"></span>
                        <span class="info-stat-value info-stat-circle" id="category-info-questions">10</span>
                    </div>
                    <div class="info-stat-item">
                        <span class="info-stat-label" data-text="ageLabel"></span>
                        <span class="info-stat-value info-stat-circle" id="category-info-age">12+</span>
                    </div>
                </div>

                <div class="category-info-actions">
                    <button class="btn btn-back" id="category-info-back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span data-text="back"></span>
                    </button>
                    <button class="btn btn-primary active" id="category-info-start">
                        <span data-text="startQuiz"></span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Экран викторины -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-label="quizProgressAriaLabel">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="quiz-info">
                    <span class="question-counter">
                        <span data-text="questionWord"></span> <span id="current-question">1</span> <span data-text="ofWord"></span> <span id="total-questions">10</span>
                    </span>
                </div>
            </div>

            <div class="quiz-content">
                <div id="question-image-container"></div>

                <h2 class="question" id="question-text"></h2>

                <div class="answers" id="answers-container" role="radiogroup" data-label="answerOptionsAriaLabel"></div>

                <div class="quiz-controls">
                    <button id="back-btn" class="btn btn-back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span data-text="back"></span>
                    </button>

                    <button id="next-btn" class="btn btn-primary">
                        <span data-text="next"></span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Экран результатов -->
        <div id="results-screen" class="screen">
            <div class="results-content">
                <div class="results-header">
                    <div class="results-icon" id="results-icon" aria-hidden="true">🏆</div>
                    <h2 class="results-title" id="results-title">Отличный результат!</h2>
                    <p class="results-message" id="results-message"></p>
                </div>

                <!-- Статистика в карточках -->
                <div class="results-stats-grid">
                    <div class="stat-card stat-card-score">
                        <div class="stat-card-icon">⭐</div>
                        <div class="stat-card-content">
                            <div class="stat-card-value" id="final-score">0</div>
                            <div class="stat-card-label" data-text="scoreLabel"></div>
                        </div>
                    </div>

                    <div class="stat-card stat-card-percentage">
                        <div class="stat-card-icon">📊</div>
                        <div class="stat-card-content">
                            <div class="stat-card-value" id="percentage">0%</div>
                            <div class="stat-card-label" data-text="percentageLabel"></div>
                        </div>
                    </div>

                    <div class="stat-card stat-card-correct">
                        <div class="stat-card-icon">✓</div>
                        <div class="stat-card-content">
                            <div class="stat-card-value" id="correct-count">0</div>
                            <div class="stat-card-label" data-text="correctLabel"></div>
                        </div>
                    </div>

                    <div class="stat-card stat-card-incorrect">
                        <div class="stat-card-icon">✗</div>
                        <div class="stat-card-content">
                            <div class="stat-card-value" id="incorrect-count">0</div>
                            <div class="stat-card-label" data-text="incorrectLabel"></div>
                        </div>
                    </div>
                </div>

                <!-- Детальная разбивка по вопросам -->
                <div class="results-details">
                    <h3 class="results-details-title" data-text="detailedBreakdownTitle"></h3>
                    <div class="results-questions-list" id="results-questions-list"></div>
                </div>

                <div class="results-actions">
                    <button class="btn btn-primary active" id="play-again-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C14.8273 3 17.35 4.30367 19 6.34267" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M21 3V7H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span data-text="playAgain"></span>
                    </button>
                    <button type="button" class="btn btn-secondary" id="change-category-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M9 5H7C5.89543 5 5 5.89543 5 7V19C5 20.1046 5.89543 21 7 21H17C18.1046 21 19 20.1046 19 19V7C19 5.89543 18.1046 5 17 5H15" stroke="currentColor" stroke-width="2"/>
                            <rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span data-text="chooseAnother"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно выхода -->
    <div id="exit-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="exit-modal-title">
        <div class="modal-content">
            <div class="modal-icon" aria-hidden="true">⚠️</div>
            <h3 class="modal-title" id="exit-modal-title" data-text="exitConfirmTitle"></h3>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="exit-cancel" data-text="exitNo"></button>
                <button class="btn btn-primary active" id="exit-confirm" data-text="exitYes"></button>
            </div>
        </div>
    </div>


    <script src="js/questions.js"></script>
    <script src="js/categories.js"></script>
    <script>window.CURRENT_LANGUAGE_CODE = 'en';</script>
    <script src="js/app.js"></script>
</body>
</html>
